name: Build mirror image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check types
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify catalogue and privacy boundary
        run: |
          test "$(node -e "console.log(require('./src/data/catalog-summary.json').total)")" = "661"
          ! grep -R -E '@vercel/analytics|/_vercel/insights' dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test immutable image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          docker run -d --name motionsites-smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m -p 127.0.0.1:18080:8080 "$IMAGE"
          trap 'docker rm -f motionsites-smoke' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/search >/dev/null
          curl -fsS http://127.0.0.1:18080/examples >/dev/null
          curl -fsS http://127.0.0.1:18080/mirror-notice >/dev/null
          curl -fsS http://127.0.0.1:18080/legal/LICENSE >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' motionsites-smoke)" != ""

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish build summary
        run: |
          {
            echo "## MotionSites mirror image"
            echo
            echo "- Upstream commit: \`2a8c639aff9007999afb4243db3e0fec28bb4a31\`"
            echo "- Deploy commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}\`"
            echo "- Catalogue entries: 661"
          } >> "$GITHUB_STEP_SUMMARY"
